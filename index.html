<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>Output Tracker</title>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Output Tracker" />
    <style>
      :root {
        --bg: #f2f2f7;
        --card: #ffffff;
        --primary: #007aff;
        --text: #000000;
        --subtext: #8e8e93;
        --border: #e5e5ea;
        --danger: #ff3b30;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        background-color: var(--bg);
        color: var(--text);
        margin: 0;
        padding: 20px 16px 40px 16px;
        -webkit-tap-highlight-color: transparent;
      }
      .header {
        text-align: center;
        margin-top: 10px;
        margin-bottom: 20px;
      }
      .header h1 {
        font-size: 22px;
        font-weight: 700;
        margin: 0;
      }
      .total-card {
        background: var(--primary);
        color: white;
        border-radius: 20px;
        padding: 24px;
        text-align: center;
        box-shadow: 0 4px 14px rgba(0, 122, 255, 0.25);
      }
      .total-card h2 {
        margin: 0;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        opacity: 0.85;
      }
      .total-card .amount {
        font-size: 44px;
        font-weight: 800;
        margin: 6px 0 0 0;
        letter-spacing: -0.5px;
      }

      /* Toggle buttons inside Total Card */
      .date-toggle {
        display: flex;
        justify-content: center;
        gap: 8px;
        margin-bottom: 12px;
      }
      .toggle-btn {
        background: rgba(255, 255, 255, 0.2);
        color: white;
        border: none;
        padding: 6px 16px;
        border-radius: 20px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      .toggle-btn.active {
        background: #ffffff;
        color: var(--primary);
      }

      .section-title {
        margin-top: 28px;
        margin-bottom: 10px;
        font-size: 13px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--subtext);
        padding-left: 4px;
      }

      .presets {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }
      .btn-preset {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 18px 8px;
        font-size: 18px;
        font-weight: 700;
        color: var(--primary);
        cursor: pointer;
        text-align: center;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
        transition: transform 0.1s ease;
      }
      .btn-preset:active {
        transform: scale(0.95);
        background: #e5f0ff;
      }

      .custom-input {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .input-row {
        display: flex;
        gap: 10px;
      }
      input[type="number"],
      input[type="datetime-local"] {
        flex: 1;
        padding: 14px;
        border-radius: 14px;
        border: 1px solid var(--border);
        font-size: 16px;
        background: var(--card);
        outline: none;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
        color: var(--text);
      }
      .btn-submit {
        background: var(--primary);
        color: white;
        border: none;
        border-radius: 14px;
        padding: 0 24px;
        font-size: 17px;
        font-weight: 600;
        cursor: pointer;
      }
      .btn-submit:active {
        transform: scale(0.95);
        opacity: 0.9;
      }

      .history {
        background: var(--card);
        border-radius: 16px;
        padding: 4px 16px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
        border: 1px solid var(--border);
      }
      .history-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 14px 0;
        border-bottom: 1px solid var(--border);
        font-size: 16px;
      }
      .history-item:last-child {
        border-bottom: none;
      }
      .history-time {
        color: var(--subtext);
        font-size: 14px;
        margin-left: 6px;
      }
      .delete-btn {
        color: var(--danger);
        font-size: 18px;
        padding: 4px 8px;
        cursor: pointer;
        font-weight: bold;
      }

      .actions {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-top: 28px;
      }
      .btn-action {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 14px;
        font-size: 15px;
        font-weight: 600;
        color: var(--primary);
        cursor: pointer;
        text-align: center;
      }
      .btn-action.clear {
        color: var(--danger);
      }
    </style>

    <!-- Firebase SDK Modular Scripts -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import {
        getFirestore,
        collection,
        addDoc,
        deleteDoc,
        doc,
        onSnapshot,
        query,
        orderBy,
        getDocs,
        writeBatch,
      } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

      // Firebase Configuration
      const firebaseConfig = {
        apiKey: "AIzaSyCOzEEmW83vM92QnoJcYQbyvPneNtK9-fQ",
        authDomain: "ostomy-tracker-31a90.firebaseapp.com",
        projectId: "ostomy-tracker-31a90",
        storageBucket: "ostomy-tracker-31a90.firebasestorage.app",
        messagingSenderId: "887052961375",
        appId: "1:887052961375:web:4b8323d5f97e75fdcdfdea",
      };

      // Initialize Firebase
      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      const logsRef = collection(db, "ostomy_logs");

      let logs = [];
      let selectedView = "today"; // 'today' or 'yesterday'

      // Real-time Cloud Listener
      const q = query(logsRef, orderBy("timestamp", "desc"));
      onSnapshot(q, (snapshot) => {
        logs = snapshot.docs.map((docSnap) => ({
          docId: docSnap.id,
          ...docSnap.data(),
        }));
        render();
      });

      window.setView = function (view) {
        selectedView = view;
        document
          .getElementById("btnToday")
          .classList.toggle("active", view === "today");
        document
          .getElementById("btnYesterday")
          .classList.toggle("active", view === "yesterday");
        document.getElementById("cardTitle").textContent =
          view === "today"
            ? "Today's Total Output"
            : "Yesterday's Total Output";
        document.getElementById("entriesTitle").textContent =
          view === "today" ? "Today's Entries" : "Yesterday's Entries";
        render();
      };

      window.logOutput = async function (amount, customTimestamp = null) {
        if (!amount || amount <= 0) return;
        try {
          await addDoc(logsRef, {
            amount: parseInt(amount, 10),
            timestamp: customTimestamp
              ? new Date(customTimestamp).toISOString()
              : new Date().toISOString(),
          });
        } catch (e) {
          alert("Error saving log: " + e.message);
        }
      };

      window.logCustom = function () {
        const input = document.getElementById("customAmount");
        const dateInput = document.getElementById("customTime");

        if (input.value) {
          const timestamp = dateInput.value ? dateInput.value : null;
          window.logOutput(input.value, timestamp);
          input.value = "";
          dateInput.value = "";
          input.blur();
        }
      };

      window.deleteEntry = async function (docId) {
        try {
          await deleteDoc(doc(db, "ostomy_logs", docId));
        } catch (e) {
          alert("Error deleting entry: " + e.message);
        }
      };

      window.exportData = function () {
        if (logs.length === 0) return alert("No data to copy yet!");
        let text = "Ostomy Output Log:\n";
        logs.forEach((l) => {
          const d = new Date(l.timestamp);
          text += `${d.toLocaleDateString()} ${d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}: ${l.amount} mL\n`;
        });
        navigator.clipboard.writeText(text);
        alert(
          "Copied summary to clipboard! You can paste it into an email or text message.",
        );
      };

      window.clearData = async function () {
        if (
          confirm(
            "Are you sure you want to delete all saved entries from cloud storage?",
          )
        ) {
          try {
            const snapshot = await getDocs(logsRef);
            const batch = writeBatch(db);
            snapshot.docs.forEach((docSnap) => {
              batch.delete(docSnap.ref);
            });
            await batch.commit();
          } catch (e) {
            alert("Error clearing data: " + e.message);
          }
        }
      };

      function render30DayDailyTotals() {
        const container = document.getElementById("monthlyTotalsList");
        if (!container) return;

        const now = new Date();
        const totalsByDate = {};

        // 1. Initialize the last 30 days with 0 mL
        for (let i = 0; i < 30; i++) {
          const d = new Date(
            now.getFullYear(),
            now.getMonth(),
            now.getDate() - i,
          );
          const dateKey = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
          totalsByDate[dateKey] = 0;
        }

        // 2. Aggregate logs into their respective local dates
        logs.forEach((entry) => {
          const d = new Date(entry.timestamp);
          const dateKey = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;

          if (totalsByDate.hasOwnProperty(dateKey)) {
            totalsByDate[dateKey] += entry.amount;
          }
        });

        // 3. Render the scrollable daily totals list (Newest first)
        container.innerHTML = "";
        const dates = Object.keys(totalsByDate).sort().reverse();

        dates.forEach((dateStr) => {
          const totalAmount = totalsByDate[dateStr];
          const [year, month, day] = dateStr.split("-");
          const formattedDate = new Date(
            year,
            month - 1,
            day,
          ).toLocaleDateString([], {
            month: "short",
            day: "numeric",
            weekday: "short",
          });

          const item = document.createElement("div");
          item.className = "history-item";
          item.innerHTML = `
      <div>
        <strong>${formattedDate}</strong>
        <span class="history-time">• ${dateStr}</span>
      </div>
      <span style="font-weight: 700; color: ${totalAmount === 0 ? "var(--subtext)" : "var(--text)"};">
        ${totalAmount} mL
      </span>
    `;
          container.appendChild(item);
        });
      }

      function render() {
        const historyEl = document.getElementById("historyList");
        const totalEl = document.getElementById("todayTotal");

        const now = new Date();
        const startOfToday = new Date(
          now.getFullYear(),
          now.getMonth(),
          now.getDate(),
        ).getTime();
        const startOfYesterday = startOfToday - 24 * 60 * 60 * 1000;
        const endOfYesterday = startOfToday;

        let filteredTotal = 0;
        historyEl.innerHTML = "";

        const filteredLogs = logs.filter((entry) => {
          const entryTime = new Date(entry.timestamp).getTime();
          if (selectedView === "today") {
            return entryTime >= startOfToday;
          } else {
            return entryTime >= startOfYesterday && entryTime < endOfYesterday;
          }
        });

        if (filteredLogs.length === 0) {
          historyEl.innerHTML = `<div class="history-item" style="color: var(--subtext)">No entries logged for ${selectedView}.</div>`;
          totalEl.textContent = "0 mL";
          return;
        }

        filteredLogs.forEach((entry) => {
          filteredTotal += entry.amount;
          const entryDate = new Date(entry.timestamp);
          const formattedTime = entryDate.toLocaleTimeString([], {
            hour: "2-digit",
            minute: "2-digit",
          });
          const formattedDate = entryDate.toLocaleDateString([], {
            month: "short",
            day: "numeric",
          });

          const item = document.createElement("div");
          item.className = "history-item";
          item.innerHTML = `
            <div>
              <strong>${entry.amount} mL</strong>
              <span class="history-time">• ${formattedDate}, ${formattedTime}</span>
            </div>
            <span class="delete-btn" onclick="deleteEntry('${entry.docId}')">✕</span>
          `;
          historyEl.appendChild(item);
        });

        totalEl.textContent = `${filteredTotal} mL`;
        // Add this as the very last line inside your render() function
        render30DayDailyTotals();
      }
    </script>
  </head>
  <body>
    <div class="header">
      <h1>Ostomy Output</h1>
    </div>

    <div class="total-card">
      <div class="date-toggle">
        <button
          id="btnToday"
          class="toggle-btn active"
          onclick="setView('today')"
        >
          Today
        </button>
        <button
          id="btnYesterday"
          class="toggle-btn"
          onclick="setView('yesterday')"
        >
          Yesterday
        </button>
      </div>
      <h2 id="cardTitle">Today's Total Output</h2>
      <div class="amount" id="todayTotal">0 mL</div>
    </div>

    <div class="section-title">Quick Log (mL)</div>
    <div class="presets">
      <button class="btn-preset" onclick="logOutput(100)">100 mL</button>
      <button class="btn-preset" onclick="logOutput(150)">150 mL</button>
      <button class="btn-preset" onclick="logOutput(200)">200 mL</button>
      <button class="btn-preset" onclick="logOutput(250)">250 mL</button>
      <button class="btn-preset" onclick="logOutput(300)">300 mL</button>
      <button class="btn-preset" onclick="logOutput(400)">400 mL</button>
    </div>

    <div class="section-title">Custom Amount / Backdate Entry</div>
    <div class="custom-input">
      <input
        type="datetime-local"
        id="customTime"
        placeholder="Optional: Pick Date & Time"
      />
      <div class="input-row">
        <input
          type="number"
          id="customAmount"
          placeholder="Amount in mL"
          inputmode="numeric"
        />
        <button class="btn-submit" onclick="logCustom()">Log</button>
      </div>
    </div>

    <div class="section-title" id="entriesTitle">Today's Entries</div>
    <div class="history" id="historyList">
      <!-- Entries list -->
    </div>

    <div class="section-title">Last 30 Days (Daily Totals)</div>
    <div
      class="history"
      id="monthlyTotalsList"
      style="max-height: 320px; overflow-y: auto"
    >
      <!-- Daily totals will render here -->
    </div>

    <div class="actions">
      <button class="btn-action" onclick="exportData()">
        Copy All Summary to Clipboard
      </button>
      <button class="btn-action clear" onclick="clearData()">
        Clear All Data
      </button>
    </div>
  </body>
</html>
