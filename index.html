<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>Fluid & Output Tracker</title>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Fluid Tracker" />
    <style>
      :root {
        --bg: #f2f2f7;
        --card: #ffffff;
        --primary: #007aff;
        --intake: #30b0c7; /* Teal color for fluid intake */
        --text: #000000;
        --subtext: #8e8e93;
        --border: #e5e5ea;
        --danger: #ff3b30;
        --success: #34c759;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        background-color: var(--bg);
        color: var(--text);
        margin: 0;
        padding: 20px 16px 40px 16px;
        -webkit-tap-highlight-color: transparent;
      }
      .header {
        text-align: center;
        margin-top: 10px;
        margin-bottom: 20px;
      }
      .header h1 {
        font-size: 22px;
        font-weight: 700;
        margin: 0;
      }

      /* Dashboard Grid for Cards */
      .cards-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-bottom: 20px;
      }
      .total-card {
        background: var(--primary);
        color: white;
        border-radius: 20px;
        padding: 16px;
        text-align: center;
        box-shadow: 0 4px 14px rgba(0, 122, 255, 0.25);
      }
      .total-card.intake-card {
        background: var(--intake);
        box-shadow: 0 4px 14px rgba(48, 176, 199, 0.25);
      }
      .total-card h2 {
        margin: 0;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        opacity: 0.9;
      }
      .total-card .amount {
        font-size: 28px;
        font-weight: 800;
        margin: 6px 0 0 0;
        letter-spacing: -0.5px;
      }

      /* Toggle buttons */
      .date-toggle {
        display: flex;
        justify-content: center;
        gap: 8px;
        margin-bottom: 16px;
      }
      .toggle-btn {
        background: rgba(0, 0, 0, 0.06);
        color: var(--text);
        border: none;
        padding: 6px 16px;
        border-radius: 20px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      .toggle-btn.active {
        background: var(--text);
        color: #ffffff;
      }

      .section-title {
        margin-top: 24px;
        margin-bottom: 10px;
        font-size: 13px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--subtext);
        padding-left: 4px;
      }

      .presets {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }
      .btn-preset {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 14px 8px;
        font-size: 16px;
        font-weight: 700;
        color: var(--primary);
        cursor: pointer;
        text-align: center;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
        transition: transform 0.1s ease;
      }
      .btn-preset.intake {
        color: var(--intake);
      }
      .btn-preset:active {
        transform: scale(0.95);
        background: #e5f0ff;
      }

      .custom-input {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .input-row {
        display: flex;
        gap: 10px;
      }
      input[type="number"],
      input[type="datetime-local"] {
        flex: 1;
        padding: 14px;
        border-radius: 14px;
        border: 1px solid var(--border);
        font-size: 16px;
        background: var(--card);
        outline: none;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
        color: var(--text);
      }
      .btn-submit {
        background: var(--primary);
        color: white;
        border: none;
        border-radius: 14px;
        padding: 0 20px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
      }
      .btn-submit.intake {
        background: var(--intake);
      }
      .btn-submit:active {
        transform: scale(0.95);
        opacity: 0.9;
      }

      .history {
        background: var(--card);
        border-radius: 16px;
        padding: 4px 16px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
        border: 1px solid var(--border);
      }
      .history-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 14px 0;
        border-bottom: 1px solid var(--border);
        font-size: 16px;
      }
      .history-item:last-child {
        border-bottom: none;
      }
      .history-time {
        color: var(--subtext);
        font-size: 14px;
        margin-left: 6px;
      }

      .item-actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .edit-btn {
        color: var(--primary);
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      .delete-btn {
        color: var(--danger);
        font-size: 18px;
        padding: 4px 8px;
        cursor: pointer;
        font-weight: bold;
      }

      .edit-row {
        display: flex;
        align-items: center;
        gap: 6px;
        width: 100%;
      }
      .edit-input {
        width: 80px;
        padding: 6px 8px;
        border-radius: 8px;
        border: 1px solid var(--border);
        font-size: 15px;
      }
      .btn-save-inline {
        background: var(--success);
        color: white;
        border: none;
        padding: 6px 12px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      .btn-cancel-inline {
        background: var(--subtext);
        color: white;
        border: none;
        padding: 6px 12px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      .btn-confirm-delete {
        background: var(--danger);
        color: white;
        border: none;
        padding: 4px 8px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
      }

      .actions {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-top: 28px;
      }
      .btn-action {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 14px;
        font-size: 15px;
        font-weight: 600;
        color: var(--primary);
        cursor: pointer;
        text-align: center;
      }
    </style>

    <!-- Firebase SDK Modular Scripts -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import {
        getFirestore,
        collection,
        addDoc,
        updateDoc,
        deleteDoc,
        doc,
        onSnapshot,
        query,
        orderBy,
      } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

      // Firebase Configuration
      const firebaseConfig = {
        apiKey: "AIzaSyCOzEEmW83vM92QnoJcYQbyvPneNtK9-fQ",
        authDomain: "ostomy-tracker-31a90.firebaseapp.com",
        projectId: "ostomy-tracker-31a90",
        storageBucket: "ostomy-tracker-31a90.firebasestorage.app",
        messagingSenderId: "887052961375",
        appId: "1:887052961375:web:4b8323d5f97e75fdcdfdea",
      };

      // Initialize Firebase
      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      const outputLogsRef = collection(db, "ostomy_logs");
      const intakeLogsRef = collection(db, "intake_logs");

      let outputLogs = [];
      let intakeLogs = [];
      let selectedView = "today"; // 'today' or 'yesterday'
      let editingDocId = null;
      let editingType = null; // 'output' or 'intake'
      let pendingDeleteId = null;
      let pendingDeleteType = null;

      // Real-time Cloud Listeners
      const qOutput = query(outputLogsRef, orderBy("timestamp", "desc"));
      onSnapshot(qOutput, (snapshot) => {
        outputLogs = snapshot.docs.map((docSnap) => ({
          docId: docSnap.id,
          type: "output",
          ...docSnap.data(),
        }));
        render();
      });

      const qIntake = query(intakeLogsRef, orderBy("timestamp", "desc"));
      onSnapshot(qIntake, (snapshot) => {
        intakeLogs = snapshot.docs.map((docSnap) => ({
          docId: docSnap.id,
          type: "intake",
          ...docSnap.data(),
        }));
        render();
      });

      window.setView = function (view) {
        selectedView = view;
        editingDocId = null;
        pendingDeleteId = null;
        document
          .getElementById("btnToday")
          .classList.toggle("active", view === "today");
        document
          .getElementById("btnYesterday")
          .classList.toggle("active", view === "yesterday");
        document.getElementById("outputCardTitle").textContent =
          view === "today" ? "Today's Output" : "Yesterday's Output";
        document.getElementById("intakeCardTitle").textContent =
          view === "today" ? "Today's Intake" : "Yesterday's Intake";
        render();
      };

      window.logItem = async function (type, amount, customTimestamp = null) {
        if (!amount || amount <= 0) return;
        const targetRef = type === "intake" ? intakeLogsRef : outputLogsRef;
        try {
          await addDoc(targetRef, {
            amount: parseInt(amount, 10),
            timestamp: customTimestamp
              ? new Date(customTimestamp).toISOString()
              : new Date().toISOString(),
          });
        } catch (e) {
          alert("Error saving log: " + e.message);
        }
      };

      window.logCustomOutput = function () {
        const input = document.getElementById("customOutputAmount");
        const dateInput = document.getElementById("customOutputTime");
        if (input.value) {
          window.logItem("output", input.value, dateInput.value || null);
          input.value = "";
          dateInput.value = "";
          input.blur();
        }
      };

      window.logCustomIntake = function () {
        const input = document.getElementById("customIntakeAmount");
        const dateInput = document.getElementById("customIntakeTime");
        if (input.value) {
          window.logItem("intake", input.value, dateInput.value || null);
          input.value = "";
          dateInput.value = "";
          input.blur();
        }
      };

      window.startEdit = function (docId, type) {
        editingDocId = docId;
        editingType = type;
        pendingDeleteId = null;
        render();
      };

      window.cancelEdit = function () {
        editingDocId = null;
        render();
      };

      window.saveEdit = async function (docId, type) {
        const input = document.getElementById(`edit-input-${docId}`);
        const newAmount = parseInt(input.value, 10);
        if (!newAmount || newAmount <= 0) return;

        const collectionName =
          type === "intake" ? "intake_logs" : "ostomy_logs";
        try {
          await updateDoc(doc(db, collectionName, docId), {
            amount: newAmount,
          });
          editingDocId = null;
        } catch (e) {
          alert("Error updating entry: " + e.message);
        }
      };

      window.promptDelete = function (docId, type) {
        pendingDeleteId = docId;
        pendingDeleteType = type;
        editingDocId = null;
        render();
      };

      window.cancelDelete = function () {
        pendingDeleteId = null;
        render();
      };

      window.confirmDelete = async function (docId, type) {
        const collectionName =
          type === "intake" ? "intake_logs" : "ostomy_logs";
        try {
          await deleteDoc(doc(db, collectionName, docId));
          pendingDeleteId = null;
        } catch (e) {
          alert("Error deleting entry: " + e.message);
        }
      };

      window.exportData = function () {
        if (outputLogs.length === 0 && intakeLogs.length === 0)
          return alert("No data to copy yet!");
        let text = "Fluid & Output Log Summary:\n\n--- OUTPUT ---\n";
        outputLogs.forEach((l) => {
          const d = new Date(l.timestamp);
          text += `${d.toLocaleDateString()} ${d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}: ${l.amount} mL\n`;
        });
        text += "\n--- FLUID INTAKE ---\n";
        intakeLogs.forEach((l) => {
          const d = new Date(l.timestamp);
          text += `${d.toLocaleDateString()} ${d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}: ${l.amount} mL\n`;
        });
        navigator.clipboard.writeText(text);
        alert("Copied summary to clipboard!");
      };

      window.downloadCSV = function () {
        if (outputLogs.length === 0 && intakeLogs.length === 0)
          return alert("No data to export!");
        let csv = "Type,Date,Time,Amount (mL)\n";

        outputLogs.forEach((l) => {
          const d = new Date(l.timestamp);
          csv += `"Output","${d.toLocaleDateString()}","${d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}",${l.amount}\n`;
        });
        intakeLogs.forEach((l) => {
          const d = new Date(l.timestamp);
          csv += `"Intake","${d.toLocaleDateString()}","${d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}",${l.amount}\n`;
        });

        const blob = new Blob([csv], { type: "text/csv" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `fluid_tracker_${new Date().toISOString().slice(0, 10)}.csv`;
        a.click();
        URL.revokeObjectURL(url);
      };

      function renderList(containerId, list, type) {
        const container = document.getElementById(containerId);
        container.innerHTML = "";

        if (list.length === 0) {
          container.innerHTML = `<div class="history-item" style="color: var(--subtext)">No ${type} logged for ${selectedView}.</div>`;
          return;
        }

        list.forEach((entry) => {
          const entryDate = new Date(entry.timestamp);
          const formattedTime = entryDate.toLocaleTimeString([], {
            hour: "2-digit",
            minute: "2-digit",
          });
          const formattedDate = entryDate.toLocaleDateString([], {
            month: "short",
            day: "numeric",
          });

          const item = document.createElement("div");
          item.className = "history-item";

          if (editingDocId === entry.docId) {
            item.innerHTML = `
              <div class="edit-row">
                <input type="number" id="edit-input-${entry.docId}" class="edit-input" value="${entry.amount}" inputmode="numeric" />
                <span style="font-size:14px; font-weight:600;">mL</span>
                <button class="btn-save-inline" onclick="saveEdit('${entry.docId}', '${type}')">Save</button>
                <button class="btn-cancel-inline" onclick="cancelEdit()">✕</button>
              </div>
            `;
          } else if (pendingDeleteId === entry.docId) {
            item.innerHTML = `
              <div>
                <strong style="color:var(--danger);">Delete entry?</strong>
              </div>
              <div class="item-actions">
                <button class="btn-confirm-delete" onclick="confirmDelete('${entry.docId}', '${type}')">Delete</button>
                <button class="btn-cancel-inline" onclick="cancelDelete()">Cancel</button>
              </div>
            `;
          } else {
            item.innerHTML = `
              <div>
                <strong>${entry.amount} mL</strong>
                <span class="history-time">• ${formattedDate}, ${formattedTime}</span>
              </div>
              <div class="item-actions">
                <span class="edit-btn" onclick="startEdit('${entry.docId}', '${type}')">Edit</span>
                <span class="delete-btn" onclick="promptDelete('${entry.docId}', '${type}')">✕</span>
              </div>
            `;
          }

          container.appendChild(item);
        });
      }

      function render() {
        const now = new Date();
        const startOfToday = new Date(
          now.getFullYear(),
          now.getMonth(),
          now.getDate(),
        ).getTime();
        const startOfYesterday = startOfToday - 24 * 60 * 60 * 1000;
        const endOfYesterday = startOfToday;

        const isToday = selectedView === "today";

        // Filter Output
        const filteredOutput = outputLogs.filter((entry) => {
          const entryTime = new Date(entry.timestamp).getTime();
          return isToday
            ? entryTime >= startOfToday
            : entryTime >= startOfYesterday && entryTime < endOfYesterday;
        });
        const totalOutput = filteredOutput.reduce(
          (acc, item) => acc + item.amount,
          0,
        );
        document.getElementById("outputTotal").textContent =
          `${totalOutput} mL`;

        // Filter Intake
        const filteredIntake = intakeLogs.filter((entry) => {
          const entryTime = new Date(entry.timestamp).getTime();
          return isToday
            ? entryTime >= startOfToday
            : entryTime >= startOfYesterday && entryTime < endOfYesterday;
        });
        const totalIntake = filteredIntake.reduce(
          (acc, item) => acc + item.amount,
          0,
        );
        document.getElementById("intakeTotal").textContent =
          `${totalIntake} mL`;

        // Render Lists
        renderList("outputHistoryList", filteredOutput, "output");
        renderList("intakeHistoryList", filteredIntake, "intake");
      }
    </script>
  </head>
  <body>
    <div class="header">
      <h1>Fluid & Output Tracker</h1>
    </div>

    <!-- Toggle Date View -->
    <div class="date-toggle">
      <button
        id="btnToday"
        class="toggle-btn active"
        onclick="setView('today')"
      >
        Today
      </button>
      <button
        id="btnYesterday"
        class="toggle-btn"
        onclick="setView('yesterday')"
      >
        Yesterday
      </button>
    </div>

    <!-- Totals Overview Cards -->
    <div class="cards-grid">
      <div class="total-card intake-card">
        <h2 id="intakeCardTitle">Today's Intake</h2>
        <div class="amount" id="intakeTotal">0 mL</div>
      </div>
      <div class="total-card">
        <h2 id="outputCardTitle">Today's Output</h2>
        <div class="amount" id="outputTotal">0 mL</div>
      </div>
    </div>

    <!-- FLUID INTAKE SECTION -->
    <div class="section-title" style="color: var(--intake)">
      Log Liquid Intake (mL)
    </div>
    <div class="presets">
      <button class="btn-preset intake" onclick="logItem('intake', 100)">
        100 mL
      </button>
      <button class="btn-preset intake" onclick="logItem('intake', 200)">
        200 mL
      </button>
      <button class="btn-preset intake" onclick="logItem('intake', 250)">
        250 mL
      </button>
      <button class="btn-preset intake" onclick="logItem('intake', 350)">
        350 mL
      </button>
      <button class="btn-preset intake" onclick="logItem('intake', 500)">
        500 mL
      </button>
      <button class="btn-preset intake" onclick="logItem('intake', 750)">
        750 mL
      </button>
    </div>

    <div class="custom-input" style="margin-top: 10px">
      <input
        type="datetime-local"
        id="customIntakeTime"
        placeholder="Optional: Pick Date & Time"
      />
      <div class="input-row">
        <input
          type="number"
          id="customIntakeAmount"
          placeholder="Intake Amount (mL)"
          inputmode="numeric"
        />
        <button class="btn-submit intake" onclick="logCustomIntake()">
          Log
        </button>
      </div>
    </div>

    <div class="section-title">Intake Entries</div>
    <div class="history" id="intakeHistoryList"></div>

    <!-- OSTOMY OUTPUT SECTION -->
    <div class="section-title" style="color: var(--primary); margin-top: 36px">
      Log Ostomy Output (mL)
    </div>
    <div class="presets">
      <button class="btn-preset" onclick="logItem('output', 100)">
        100 mL
      </button>
      <button class="btn-preset" onclick="logItem('output', 150)">
        150 mL
      </button>
      <button class="btn-preset" onclick="logItem('output', 200)">
        200 mL
      </button>
      <button class="btn-preset" onclick="logItem('output', 250)">
        250 mL
      </button>
      <button class="btn-preset" onclick="logItem('output', 300)">
        300 mL
      </button>
      <button class="btn-preset" onclick="logItem('output', 400)">
        400 mL
      </button>
    </div>

    <div class="custom-input" style="margin-top: 10px">
      <input
        type="datetime-local"
        id="customOutputTime"
        placeholder="Optional: Pick Date & Time"
      />
      <div class="input-row">
        <input
          type="number"
          id="customOutputAmount"
          placeholder="Output Amount (mL)"
          inputmode="numeric"
        />
        <button class="btn-submit" onclick="logCustomOutput()">Log</button>
      </div>
    </div>

    <div class="section-title">Output Entries</div>
    <div class="history" id="outputHistoryList"></div>

    <!-- GLOBAL ACTIONS -->
    <div class="actions">
      <button class="btn-action" onclick="exportData()">
        Copy All Summary to Clipboard
      </button>
      <button class="btn-action" onclick="downloadCSV()">
        Download Full Log as CSV
      </button>
    </div>
  </body>
</html>
